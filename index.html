<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BURGEGRAM</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { 
            --bg: #0a0e14;
            --bg-grad: radial-gradient(circle at top right, #1a2a3a, #0a0e14);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --msg-out: linear-gradient(135deg, #3a7bd5, #00d2ff);
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; }

        /* PTR индикатор */
        #ptr { 
            position: absolute; top: -70px; width: 100%; height: 70px; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--primary); transition: transform 0.3s; z-index: 9999; 
            font-weight: bold; text-shadow: 0 0 10px var(--primary);
            background: #0a0e14; border-bottom: 1px solid var(--glass-border);
        }

        #main-app { display: none; height: 100dvh; width: 100%; background: var(--bg-grad); }
        
        .sidebar { 
            width: 320px; background: #111821; 
            border-right: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; z-index: 500; position: relative;
        }

        .sidebar-content { display: none; flex: 1; overflow-y: auto; padding: 20px; background: #111821; }
        .sidebar-content.active { display: block !important; }

        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg); z-index: 100; }
        
        header { 
            height: 70px; padding: 0 20px; display: flex; align-items: center; 
            background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--glass-border); 
            touch-action: none; 
        }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 75%; padding: 12px 18px; border-radius: 20px; position: relative; }
        .msg.out { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
        .msg.in { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 12px; cursor: pointer; margin-top: 5px; }

        .menu-drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0a0e14; transition: 0.4s; z-index: 2000; padding: 40px 0; border-right: 1px solid var(--glass-border); }
        .menu-drawer.open { left: 0; }

        #viewer { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            z-index: 5000; flex-direction: column; align-items: center; justify-content: center; 
        }
        #viewer img { max-width: 90%; max-height: 80%; border-radius: 10px; }

        input { background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; outline: none; }
        button { background: var(--msg-out); border: none; border-radius: 12px; color: white; padding: 10px 15px; font-weight: bold; cursor: pointer; }

        @media (max-width: 800px) {
            .sidebar { position: absolute; inset: 0; width: 100%; z-index: 500; }
            .sidebar.hidden { display: none; }
            .back-btn { display: block !important; margin-right: 15px; font-size: 24px; color: var(--primary); }
        }

        .list-item { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .auth-screen { position: fixed; inset: 0; background: var(--bg-grad); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .auth-card { background: #111821; padding: 40px; border-radius: 30px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--glass-border); }
    </style>
</head>
<body>

    <div id="ptr">⬇ ОБНОВИТЬ BURGEGRAM</div>

    <div id="viewer" onclick="this.style.display='none'">
        <img id="viewer-img" src="">
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="event.stopPropagation(); downloadImg()">СКАЧАТЬ</button>
            <button onclick="this.parentElement.parentElement.style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="auth-screen" class="auth-screen">
        <div class="auth-card" id="login-box">
            <h1 style="color:var(--primary)">BURGEGRAM</h1>
            <input type="text" id="l-user" placeholder="Логин" style="width:100%"><br><br>
            <input type="password" id="l-pass" placeholder="Пароль" style="width:100%"><br><br>
            <button onclick="auth('login')" style="width:100%">ВОЙТИ</button>
            <p onclick="toggleAuth(true)" style="cursor:pointer; margin-top:20px; opacity:0.6;">Регистрация</p>
        </div>
        <div class="auth-card" id="reg-box" style="display:none">
            <h1>РЕГИСТРАЦИЯ</h1>
            <input type="text" id="r-user" placeholder="Логин" style="width:100%"><br><br>
            <input type="password" id="r-pass" placeholder="Пароль" style="width:100%"><br><br>
            <button onclick="auth('register')" style="width:100%">СОЗДАТЬ</button>
            <p onclick="toggleAuth(false)" style="cursor:pointer; margin-top:20px; opacity:0.6;">Назад</p>
        </div>
    </div>

    <div id="menu-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500;" onclick="toggleMenu(false)"></div>
    <div id="menu-drawer" class="menu-drawer">
        <div style="padding: 0 30px 30px; font-weight: bold; color: var(--primary); font-size: 22px;">BURGEGRAM</div>
        <div style="padding: 15px 30px; cursor: pointer;" onclick="switchSection('chats')">💬 Чаты</div>
        <div style="padding: 15px 30px; cursor: pointer;" onclick="switchSection('profile')">👤 Профиль</div>
        <div style="padding: 15px 30px; cursor: pointer;" onclick="switchSection('settings')">⚙️ Настройки</div>
        <div style="padding: 15px 30px; cursor: pointer; color: #ff4d4d; margin-top: 50px;" onclick="logout()">🚪 Выход</div>
    </div>

    <div id="main-app">
        <div class="sidebar" id="sidebar">
            <div id="sidebar-header-ptr" class="sidebar-header" style="padding:20px; display:flex; gap:10px; align-items:center; background:#111821; border-bottom: 1px solid var(--glass-border);">
                <div onclick="toggleMenu(true)" style="font-size:26px; cursor:pointer; color:var(--primary)">☰</div>
                <div style="flex:1; display:flex; gap:5px; background:rgba(0,0,0,0.3); border-radius:12px; padding-right:10px; border:1px solid var(--glass-border);">
                    <input type="text" id="user-search" placeholder="ID или имя..." style="flex:1; border:none; background:transparent;">
                    <button onclick="search()" style="background:none; padding:0; font-size:18px;">🔍</button>
                </div>
            </div>
            <div id="section-chats" class="sidebar-content active">
                <div id="friendList"></div>
            </div>
            <div id="section-profile" class="sidebar-content">
                <h2 id="p-name">---</h2>
                <div id="p-uid" style="color:var(--primary); font-size:20px; margin-bottom:20px;">00000</div>
                <h4>Запросы:</h4>
                <div id="requestList"></div>
            </div>
            <div id="section-settings" class="sidebar-content">
                <h3>Настройки</h3>
                <input type="text" id="set-uid" placeholder="Новый UID" style="width:100%"><br><br>
                <input type="password" id="set-pass" placeholder="Новый пароль" style="width:100%"><br><br>
                <button onclick="saveSettings()" style="width:100%">СОХРАНИТЬ</button>
            </div>
        </div>

        <div class="chat-container">
            <header id="chat-header-ptr">
                <div class="back-btn" style="display:none;" onclick="closeChat()">←</div>
                <div id="chatTitle">BURGEGRAM</div>
            </header>
            <div id="messages"></div>
            <div class="input-area" style="padding:15px; display:flex; gap:10px; background: rgba(0,0,0,0.2);">
                <input type="file" id="file-input" hidden accept="image/*" onchange="sendImg(this)">
                <button onclick="document.getElementById('file-input').click()" style="background:rgba(255,255,255,0.05);">🖼️</button>
                <input type="text" id="m-text" placeholder="Сообщение..." style="flex:1;">
                <button onclick="send()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myData = null, targetUser = "";

        // --- ФУНКЦИЯ ДЛЯ ENTER ---
        function setEnter(id, func) {
            document.getElementById(id).addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); func(); }
            });
        }

        // --- PULL-TO-REFRESH ---
        let startY = 0;
        let isPtrActive = false;
        const handleStart = (e) => { startY = e.touches ? e.touches[0].pageY : e.pageY; isPtrActive = true; };
        const handleMove = (e) => {
            if (!isPtrActive) return;
            let y = e.touches ? e.touches[0].pageY : e.pageY;
            let diff = y - startY;
            if (diff > 100) document.getElementById('ptr').style.transform = 'translateY(70px)';
        };
        const handleEnd = () => {
            if (document.getElementById('ptr').style.transform === 'translateY(70px)') location.reload();
            document.getElementById('ptr').style.transform = 'translateY(0px)';
            isPtrActive = false;
        };

        const ptrZones = [document.getElementById('chat-header-ptr'), document.getElementById('sidebar-header-ptr')];
        ptrZones.forEach(z => {
            z.addEventListener('touchstart', handleStart, {passive: true});
            z.addEventListener('touchmove', handleMove, {passive: true});
            z.addEventListener('touchend', handleEnd);
        });

        // --- AUTH ---
        function auth(t) {
            const u = document.getElementById(t==='login'?'l-user':'r-user').value.trim();
            const p = document.getElementById(t==='login'?'l-pass':'r-pass').value.trim();
            if (u && p) socket.emit(t, { login: u, password: p });
        }
        
        // ВЕШАЕМ ENTER НА ВХОД
        setEnter('l-pass', () => auth('login'));
        setEnter('r-pass', () => auth('register'));

        socket.on('auth_success', d => {
            myData = d;
            localStorage.setItem('roma_u', d.login); localStorage.setItem('roma_p', d.password);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            updateUI();
        });

        function switchSection(s) {
            document.querySelectorAll('.sidebar-content').forEach(sec => { sec.style.display = 'none'; sec.classList.remove('active'); });
            const t = document.getElementById('section-' + s);
            t.style.display = 'block'; t.classList.add('active');
            toggleMenu(false);
            if (window.innerWidth <= 800) document.getElementById('sidebar').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('p-name').innerText = myData.login;
            document.getElementById('p-uid').innerText = myData.uid;
            const fl = document.getElementById('friendList'); fl.innerHTML = "";
            myData.friends.forEach(f => {
                let d = document.createElement('div'); d.className = "list-item"; d.innerHTML = `👤 ${f}`;
                d.onclick = () => openChat(f); fl.appendChild(d);
            });
            const rl = document.getElementById('requestList'); rl.innerHTML = "";
            myData.requests.forEach(r => {
                let d = document.createElement('div'); d.className = "list-item";
                d.innerHTML = `${r} <button onclick="socket.emit('accept_request', '${r}')" style="margin-left:auto; font-size:10px;">ПРИНЯТЬ</button>`;
                rl.appendChild(d);
            });
        }

        // --- ЧАТ И ФОТО ---
        function openChat(u) {
            targetUser = u; 
            document.getElementById('chatTitle').innerText = u;
            document.getElementById('messages').innerHTML = "";
            if (window.innerWidth <= 800) document.getElementById('sidebar').classList.add('hidden');
            socket.emit('load_history', { me: myData.login, with: targetUser });
        }

        function send() {
            let t = document.getElementById('m-text');
            if (t.value.trim() && targetUser) {
                socket.emit('private_msg', { to: targetUser, text: t.value, type: 'text' });
                t.value = "";
            }
        }
        
        // ВЕШАЕМ ENTER НА СООБЩЕНИЯ
        setEnter('m-text', send);

        function sendImg(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => socket.emit('private_msg', { to: targetUser, type: 'image', media: reader.result });
            reader.readAsDataURL(file);
        }

        socket.on('new_private_msg', m => { if (m.from === targetUser || m.from === myData.login) addMsg(m); });
        socket.on('history_loaded', h => { h.forEach(addMsg); });

        function addMsg(m) {
            const c = document.getElementById('messages');
            const d = document.createElement('div');
            d.className = `msg ${m.from === myData.login ? 'out' : 'in'}`;
            if (m.type === 'image') d.innerHTML = `<img src="${m.media}" onclick="openViewer('${m.media}')">`;
            else d.innerHTML = `<div>${m.text}</div>`;
            d.innerHTML += `<small style="display:block; font-size:9px; opacity:0.5; text-align:right; margin-top:5px;">${m.time}</small>`;
            c.appendChild(d); c.scrollTop = c.scrollHeight;
        }

        function openViewer(src) { document.getElementById('viewer-img').src = src; document.getElementById('viewer').style.display = 'flex'; }
        function downloadImg() { const a = document.createElement('a'); a.href = document.getElementById('viewer-img').src; a.download = "burgergram_img.png"; a.click(); }

        // --- ПРОЧЕЕ ---
        function toggleMenu(o) { document.getElementById('menu-drawer').classList.toggle('open', o); document.getElementById('menu-overlay').style.display = o ? 'block' : 'none'; }
        function closeChat() { document.getElementById('sidebar').classList.remove('hidden'); targetUser = ""; }
        function logout() { localStorage.clear(); location.reload(); }
        function toggleAuth(r) { document.getElementById('login-box').style.display = r ? 'none' : 'block'; document.getElementById('reg-box').style.display = r ? 'block' : 'none'; }
        function saveSettings() { socket.emit('update_settings', { uid: document.getElementById('set-uid').value.trim(), password: document.getElementById('set-pass').value.trim() }); }
        
        function search() { let q = document.getElementById('user-search').value.trim(); if (q) socket.emit('search_user', q); }
        
        // ВЕШАЕМ ENTER НА ПОИСК
        setEnter('user-search', search);

        socket.on('search_result', r => { if (r.error) alert(r.error); else if (confirm(`Добавить ${r.login}?`)) socket.emit('send_request', r.login); });

        window.onload = () => {
            const u = localStorage.getItem('roma_u'), p = localStorage.getItem('roma_p');
            if (u && p) socket.emit('login', { login: u, password: p });
        };
    </script>
</body>
</html>
